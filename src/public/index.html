<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tisch-Reservierungen · Oktoberfest 2026</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div>
          <h1>Tisch-Reservierungen · Oktoberfest 2026</h1>
          <p class="subtitle">Verfügbare Reservierungen aller Festzelt OS Portale auf einen Blick</p>
        </div>
        <div class="toolbar">
          <span id="fetched-at" class="muted"></span>
          <span id="progress" class="muted"></span>
          <button id="subscribe" class="subscribe" type="button" title="Bei Änderungen der gefilterten Reservierungen informieren">
            <span id="subscribe-label">Abonnieren</span>
            <span id="subscribe-badge" class="subscribe-badge" hidden></span>
          </button>
          <button id="refresh">Aktualisieren</button>
        </div>
      </div>

      <div class="filter-bar">
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false">
          <span>Filter</span>
          <span id="filter-count" class="filter-count" hidden></span>
          <span class="filter-chevron">▾</span>
        </button>
      </div>

      <div class="filters" id="filters">
        <div class="filter-group">
          <label>Festzelt</label>
          <div class="dropdown" id="tent-dd">
            <button type="button" class="dd-trigger" data-dd="tent">Alle Festzelte ▾</button>
            <div class="dd-panel" id="tent-panel" hidden></div>
          </div>
        </div>

        <div class="filter-group">
          <label>Datum von</label>
          <input type="date" id="date-from" />
        </div>
        <div class="filter-group">
          <label>Datum bis</label>
          <input type="date" id="date-to" />
        </div>

        <button type="button" class="chip toggle" id="weekend-toggle">Nur Wochenenden</button>

        <div class="filter-group">
          <label>Zeit</label>
          <div class="chips" id="shift-chips"></div>
        </div>

        <div class="filter-group">
          <label>Bereich</label>
          <div class="dropdown" id="area-dd">
            <button type="button" class="dd-trigger" data-dd="area">Alle Bereiche ▾</button>
            <div class="dd-panel" id="area-panel" hidden></div>
          </div>
        </div>

        <div class="filter-group filter-group-grow">
          <label>Suche</label>
          <input type="search" id="search" placeholder="Zelt, Datum, Zeit…" />
        </div>

        <button type="button" class="reset" id="reset">Zurücksetzen</button>
      </div>

      <div class="filter-summary muted" id="filter-summary"></div>
    </header>

    <main>
      <div class="result-head">
        <div>
          <h2 id="result-head">Verfügbare Reservierungen</h2>
          <span id="result-shifts" class="muted"></span>
        </div>
      </div>
      <div id="app">
        <p class="muted">Lade Daten …</p>
      </div>
    </main>

    <footer class="muted">
      Daten werden direkt von den öffentlichen Reservierungsportalen der Festzelte abgerufen (Stand: <span id="fetched-at-2"></span>)<span id="sched-info"></span>.
    </footer>

    <div id="notify" class="notify" hidden>
      <div class="notify-head">
        <strong>Änderungen</strong>
        <button type="button" id="notify-close" aria-label="Schließen">×</button>
      </div>
      <div id="notify-body" class="notify-body"></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
